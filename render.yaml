services:
  # PostgreSQL Database
  - type: pserv
    name: avoro-db
    plan: free
    databaseName: avoro
    user: avoro_user
    region: singapore

  # Server (Express API)
  - type: web
    name: avoro-server
    env: node
    region: singapore
    plan: free
    buildCommand: cd server && npm install && npx prisma generate && npm run build
    startCommand: cd server && npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: avoro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: SITE_URL
        value: https://avoro.in
      - key: NODE_ENV
        value: production
      - key: SHIPROCKET_EMAIL
        value: shudhanshup2004@gmail.com
      - key: SHIPROCKET_PASSWORD
        value: q5xDiaq8Tvf9%YBWyXEJ89LXcLMn6oBD
      - key: SHIPROCKET_PICKUP_LOCATION
        value: work-1
      - key: SHIPROCKET_PICKUP_POSTCODE
        value: "231001"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # Client (Next.js)
  - type: web
    name: avoro-client
    env: node
    region: singapore
    plan: free
    buildCommand: cd client && npm install && npm run build
    startCommand: cd client && npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://avoro.onrender.com
      - key: NEXT_PUBLIC_ADMIN_URL
        value: https://avoro-admin.onrender.com
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        sync: false
      - key: NODE_ENV
        value: production

  # Admin (Vite)
  - type: web
    name: avoro-admin
    env: node
    region: singapore
    plan: free
    buildCommand: cd admin && npm install && npm run build
    startCommand: cd admin && npm run preview -- --host
    envVars:
      - key: VITE_API_URL
        value: https://avoro.onrender.com
      - key: NODE_ENV
        value: production
